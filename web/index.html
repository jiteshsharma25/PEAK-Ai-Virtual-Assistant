<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEAK</title>

    <link rel="shortcut icon" href="assests/images/logo.ico" type="image/x-icon">
    <!-- Weather Icons + Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Weather Icons (Optional if not yet included) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">

    <!-- Particle js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js" type="text/javascript"></script>

    <!-- Texallate -->
    <link rel="stylesheet" href="assests/vendore/texllate/animate.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Custom styles for the colorful mic button */
        #MicBtn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2rem;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        #MicBtn:hover {
            transform: scale(1);
            background: linear-gradient(135deg, #fad0c4 0%, #ff9a9e 100%);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #MicBtn:active {
            transform: scale(0.95);
        }

        #MicBtn i {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        /* Additional Weather Overlay Styles (customize further if needed) */
        .weather-launcher {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-text {
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .weather-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .weather-close {
            position: absolute;
            top: 20px;
            right: 30px;
            cursor: pointer;
            font-size: 2rem;
        }

        .weather-search input {
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        .weather-search button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            margin-left: 5px;
            background-color: #007bff;
            color: white;
        }

        .weather-details {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <section id="Oval" class="mb-4">
            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div class="d-flex justify-content-center align-items-center" style="height:80vh;">
                        <canvas id="canvasOne" width="900" height="420" style="position:absolute"></canvas>
                        <div id="PeekHood">
                            <div class="square">
                                <span class="" circle></span>
                                <span class="" circle></span>
                                <span class="" circle></span>
                            </div>
                        </div>
                    </div>
                    <h5 class="text-light text text-center">Ask me anything</h5>

                    <!-- Weather launcher added here -->
                    <div class="weather-launcher">
                        <span class="weather-text" onclick="showWeatherScreen()">Weather</span>
                    </div>

                    <div class="col-md-12 mt-4 pt-4">
                        <div class="text-center">
                            <div id="TextInpur" class="d-flex justify-content-center">
                                <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic-fill"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-1"></div>
                </div>
            </div>
        </section>

        <section id="SiriWave" class="mb-4" hidden>
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="d-flex justify-content-center align-items-center" style="height:100vh ;">
                            <div class="">
                                <p class="text-start text-light mb-4 siri-message">Hi sir</p>
                                <div id="siri-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Weather overlay added at bottom -->
    <div id="weather-screen" class="weather-overlay">
        <div class="weather-close" onclick="hideWeatherScreen()">✕</div>
        <div class="weather-content">
            <div class="weather-search">
                <input type="text" id="weather-location" placeholder="Enter city name">
                <button onclick="fetchWeather()">Search</button>
            </div>
            <div class="weather-display">
                <div class="weather-main">
                    <h1 id="weather-city">—</h1>
                    <div class="weather-temp">
                        <span id="weather-temperature">—</span>
                        <span class="weather-unit">°C</span>
                    </div>
                    <div id="weather-icon"></div>
                    <p id="weather-description">—</p>
                </div>
                <div class="weather-details">
                    <div class="weather-card">
                        <i class="wi wi-humidity"></i>
                        <span id="weather-humidity">—%</span>
                        <p>Humidity</p>
                    </div>
                    <div class="weather-card">
                        <i class="wi wi-strong-wind"></i>
                        <span id="weather-wind">— km/h</span>
                        <p>Wind</p>
                    </div>
                    <div class="weather-card">
                        <i class="wi wi-barometer"></i>
                        <span id="weather-pressure">— hPa</span>
                        <p>Pressure</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script src='https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js'></script>

    <!-- Weather functions -->
    <script>
        function showWeatherScreen() {
            document.getElementById('weather-screen').style.display = 'flex';
        }

        function hideWeatherScreen() {
            document.getElementById('weather-screen').style.display = 'none';
        }

        function fetchWeather() {
            const city = document.getElementById('weather-location').value;
            if (!city) return alert("Please enter a city");

            // Placeholder: Replace with your API logic
            document.getElementById('weather-city').innerText = city;
            document.getElementById('weather-temperature').innerText = "25";
            document.getElementById('weather-description').innerText = "Sunny";
            document.getElementById('weather-humidity').innerText = "60%";
            document.getElementById('weather-wind').innerText = "10 km/h";
            document.getElementById('weather-pressure').innerText = "1012 hPa";
        }
    </script>

    <script src="script.js"></script>
    <script src="assests/vendore/texllate/jquery.fittext.js"></script>
    <script src="assests/vendore/texllate/jquery.lettering.js"></script>
    <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    <script src="main.js"></script>
    <script src="controller.js"></script>
    <script src="/eel.js"></script>
</body>
</html>
